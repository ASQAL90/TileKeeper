name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # microsoft/setup-msbuild@v3.0.0

      - name: Build aplikasi (Release, AnyCPU)
        run: msbuild src/TileKeeper/TileKeeper.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build proyek test
        run: msbuild tests/TileKeeper.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
