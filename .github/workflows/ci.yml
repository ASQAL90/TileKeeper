name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # microsoft/setup-msbuild@v2

      - name: Build aplikasi (Release, AnyCPU)
        run: msbuild src/TileKeeper/TileKeeper.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build proyek test
        run: msbuild tests/TileKeeper.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
