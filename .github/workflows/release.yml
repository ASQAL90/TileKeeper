name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout@v7.0.1

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57  # microsoft/setup-msbuild@v3.0.0

      - name: Build (Release, AnyCPU)
        run: msbuild src/TileKeeper/TileKeeper.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/TileKeeper/bin/Release/TileKeeper.exe dist/
          Copy-Item src/TileKeeper/bin/Release/TileKeeper.exe.config dist/
          if (Test-Path src/TileKeeper/bin/Release/TileKeeper.ico) { Copy-Item src/TileKeeper/bin/Release/TileKeeper.ico dist/ }
          Copy-Item README.md dist/
          Copy-Item docs/USER_GUIDE.md dist/
          Copy-Item docs/SUPPORTED-FILES.md dist/
          Compress-Archive -Path dist/* -DestinationPath TileKeeper-win.zip -Force
          $hash = (Get-FileHash TileKeeper-win.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TileKeeper-win.zip" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # actions/upload-artifact@v7.0.2
        with:
          name: TileKeeper-win
          path: |
            TileKeeper-win.zip
            SHA256SUMS.txt

      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $path = "docs/release-notes/$version.md"
          if (!(Test-Path $path)) { throw "Missing release notes: $path" }
          $text = Get-Content $path -Raw
          if ($text -notmatch '(?m)^## (Fitur baru|Perbaikan bug|Peningkatan keamanan|Catatan)' -or $text -notmatch '(?m)^- ') {
            throw "Release notes $path do not contain a recognized section and bullet."
          }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # softprops/action-gh-release@v3.0.4
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            TileKeeper-win.zip
            SHA256SUMS.txt
