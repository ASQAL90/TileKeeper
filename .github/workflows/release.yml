name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce  # microsoft/setup-msbuild@v2

      - name: Build (Release, AnyCPU)
        run: msbuild src/TileKeeper/TileKeeper.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/TileKeeper/bin/Release/TileKeeper.exe dist/
          Copy-Item src/TileKeeper/bin/Release/TileKeeper.exe.config dist/
          if (Test-Path src/TileKeeper/bin/Release/TileKeeper.ico) { Copy-Item src/TileKeeper/bin/Release/TileKeeper.ico dist/ }
          Copy-Item README.md dist/
          Copy-Item docs/USER_GUIDE.md dist/
          Compress-Archive -Path dist/* -DestinationPath TileKeeper-win.zip -Force
          $hash = (Get-FileHash TileKeeper-win.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  TileKeeper-win.zip" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # actions/upload-artifact@v4
        with:
          name: TileKeeper-win
          path: |
            TileKeeper-win.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release@v2
        with:
          files: |
            TileKeeper-win.zip
            SHA256SUMS.txt
          generate_release_notes: true
