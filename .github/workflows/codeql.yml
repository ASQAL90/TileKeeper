name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # github/codeql-action@v3
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # github/codeql-action@v3

  actions:
    name: Analyze Actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # github/codeql-action@v3
        with:
          languages: actions

      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # github/codeql-action@v3
